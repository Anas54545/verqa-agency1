<style>:root{--c:#1F1F1F;--b:#C6B19A;--i:#F8F8F6;--s:#E8E4DE;--d:#151515;--ar:'Alexandria','IBM Plex Sans Arabic',sans-serif;--en:'Manrope',Inter,sans-serif}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font:400 1rem/1.8 var(--ar);background:var(--i);color:var(--c)}
html[lang=en] body{font-family:var(--en);line-height:1.65}
a{color:inherit}img{max-width:100%}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.sr{position:absolute;left:-9999px}.skip{position:absolute;top:-60px;background:var(--b);color:var(--d);padding:.5rem 1rem;z-index:99}.skip:focus{top:0}
#loader{position:fixed;inset:0;background:var(--d);display:grid;place-items:center;z-index:100;transition:opacity .6s,visibility .6s}
#loader img{width:84px;animation:pulse 1.2s infinite alternate;border-radius:50%}#loader.off{opacity:0;visibility:hidden}
@keyframes pulse{to{transform:scale(1.15);opacity:.6}}
header{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:.7rem clamp(1rem,4vw,3rem);background:rgba(21,21,21,.78);backdrop-filter:blur(14px);color:var(--i)}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;letter-spacing:.3em;font:800 1rem var(--en)}.logo img{border-radius:50%}
nav{display:flex;align-items:center;gap:1.4rem;font-size:.92rem}nav a{text-decoration:none;opacity:.85}nav a:hover{opacity:1;color:var(--b)}
.btn{display:inline-block;padding:.8rem 1.6rem;border-radius:99px;background:var(--b);color:var(--d)!important;font-weight:600;text-decoration:none;border:1px solid var(--b);cursor:pointer;font-family:inherit;font-size:.95rem;opacity:1!important;transition:transform .25s,background .25s}
.btn:hover{transform:translateY(-3px);background:var(--i)}.btn.ghost{background:transparent;color:var(--i)!important}.btn.ghost:hover{color:var(--d)!important}
.lang{background:none;border:1px solid var(--b);color:var(--b);border-radius:99px;padding:.3rem .9rem;cursor:pointer;font:600 .8rem var(--en)}
.burger{display:none;background:none;border:0;width:40px;height:40px;cursor:pointer;position:relative}.burger i{position:absolute;left:8px;right:8px;height:2px;background:var(--i);transition:.3s}.burger i:first-child{top:15px}.burger i:last-child{top:23px}
.burger[aria-expanded=true] i:first-child{top:19px;transform:rotate(45deg)}.burger[aria-expanded=true] i:last-child{top:19px;transform:rotate(-45deg)}
.dark{background:var(--d);color:var(--i)}.stone{background:var(--s)}
.hero{min-height:100svh;position:relative;display:flex;align-items:center;padding:7rem clamp(1rem,6vw,6rem) 3rem;overflow:hidden;background:radial-gradient(ellipse at 70% 40%,#2b2620,var(--d) 65%)}
#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.fallback{position:absolute;width:min(50vw,320px);inset-inline-end:12%;top:30%;border-radius:50%;display:none}.nogl .fallback{display:block}.nogl #scene{display:none}
.hero-txt{position:relative;max-width:620px;pointer-events:none}.hero-txt .row,.hero-txt a{pointer-events:auto}
h1{font-weight:800;font-size:clamp(2.2rem,6vw,4.6rem);line-height:1.2;margin-bottom:1.2rem}
html[lang=en] h1{line-height:1.05;letter-spacing:-.02em}
.hero p{opacity:.8;font-size:1.1rem;margin-bottom:2rem}.row{display:flex;gap:1rem;flex-wrap:wrap}
.free{display:block;margin-top:1.4rem;color:var(--b)}.free.big{font-size:1.4rem;font-weight:600;margin:1rem 0 2rem}
.sec{padding:clamp(4rem,9vw,8rem) clamp(1rem,6vw,6rem)}.sec>h2,.split h2{font-size:clamp(1.8rem,4vw,3rem);margin-bottom:1.5rem;line-height:1.3;font-weight:800}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,5rem);align-items:start}
.strip{padding:3rem 1rem;text-align:center;background:var(--s)}.strip>p{opacity:.7;margin-bottom:1.5rem}
.orbs{list-style:none;display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:center;padding:0}
.orbs li{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;text-align:center;font:600 .85rem/1.3 var(--en);letter-spacing:.06em;background:radial-gradient(circle at 30% 25%,#fff,var(--i) 45%,var(--b));box-shadow:0 18px 30px -12px rgba(0,0,0,.4),inset 0 -6px 12px rgba(31,31,31,.12);animation:fl 5s ease-in-out infinite alternate}
.orbs li:nth-child(2n){animation-delay:-1.5s}.orbs li:nth-child(3n){animation-delay:-3s}
@keyframes fl{to{transform:translateY(-14px)}}
.facts{list-style:none;padding:0;display:grid;gap:1px;background:var(--b);border:1px solid var(--b)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem}
.card{padding:1.8rem;border:1px solid rgba(198,177,154,.3);border-radius:4px;background:linear-gradient(160deg,#222,#181818);transition:transform .35s,border-color .35s;transform-style:preserve-3d;will-change:transform}
.card:hover{border-color:var(--b)}.card svg{width:44px;height:44px;stroke:var(--b);fill:none;stroke-width:1.5;margin-bottom:1rem}.card h3{margin-bottom:.5rem}.card p{opacity:.7;font-size:.95rem}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2rem;counter-reset:s}
.steps li{padding-top:1rem;border-top:2px solid var(--b);counter-increment:s}.steps li::before{content:counter(s);font:800 1.6rem var(--en);color:var(--b)}.steps h3{margin:.3rem 0}.steps p{opacity:.75;font-size:.95rem}
.note{max-width:60ch;margin-bottom:2rem;padding-inline-start:1rem;border-inline-start:3px solid var(--b)}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem;margin-bottom:4rem}
.case{background:var(--i);padding:2rem}.case h3{margin-bottom:1rem}.case .big{font:800 clamp(2.4rem,6vw,3.4rem)/1 var(--en)}
.m{margin-top:1.1rem}.m span{font-size:.85rem;opacity:.7;display:flex;justify-content:space-between}.bar{height:8px;background:var(--s);margin-top:.3rem}.bar i{display:block;height:100%;width:0;background:var(--c);transition:width 1.2s cubic-bezier(.2,.7,.2,1)}.bar i.b{background:var(--b)}.in .bar i{width:var(--w)}
.ph{border:1px dashed var(--b);padding:1.5rem;font-style:normal;opacity:.75}
h3{font-size:1.15rem}.stone>h3{margin-bottom:1rem}
.links{list-style:none;padding:0;display:grid;gap:.5rem}.links a{color:var(--b);text-decoration:none;border-bottom:1px solid transparent}.links a:hover{border-color:var(--b)}
form{display:grid;grid-template-columns:1fr 1fr;gap:1rem}label{display:grid;gap:.3rem;font-size:.9rem}.full{grid-column:1/-1}
input,select,textarea{width:100%;padding:.8rem;background:#222;color:var(--i);border:1px solid #444;border-radius:4px;font:inherit}input:focus,select:focus,textarea:focus{border-color:var(--b);outline:0}
label.bad input,label.bad select,label.bad textarea{border-color:#e07a6a}em{color:#e8978a;font-style:normal;font-size:.8rem;min-height:1em}
footer{display:flex;justify-content:space-between;padding:1.5rem clamp(1rem,6vw,6rem);background:var(--d);color:var(--i);border-top:1px solid #333;font-size:.85rem}
.rv{opacity:0;transform:translateY(24px);transition:.8s}.rv.in{opacity:1;transform:none}
@media(max-width:860px){.split,form{grid-template-columns:1fr}.burger{display:block}
 nav{position:fixed;inset:58px 0 auto;flex-direction:column;align-items:stretch;text-align:center;background:var(--d);padding:1.5rem;gap:1rem;transform:translateY(-120%);transition:transform .4s;visibility:hidden}nav.open{transform:none;visibility:visible}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}.rv{opacity:1;transform:none}.bar i{width:var(--w)}}
</style>
</head>
